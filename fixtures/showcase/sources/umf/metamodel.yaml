umf: 0.10.0
id: urn:umf:metamodel
title: UMF for UMF
vocabularies:
  umf.metamodel:
    version: 1.0.0
extensions:
  umf.metamodel:
    language:
      version: 0.10.0
      root: document
      schemaId: urn:umf:core:0.10.0
      semanticReference: semanticType
      semanticReferenceId: urn:umf:core:semantic-type-reference:1.0.0
      packageEnvelope: extensionPackage
      packageSchemaId: urn:umf:extension-package:0.10.0
    description: Authored language definitions. Structural shapes and ordered constraints compile to
      current portable enforcement.
    constraints:
      profile: umf.constraints/1
      steps:
        - op: let
          name: elements
          value:
            op: flatten
            args:
              - op: map
                args:
                  - op: get
                    args:
                      - var: doc
                      - - modules
                as: wm
                index: wmi
                value:
                  op: map
                  args:
                    - op: get
                      args:
                        - var: wm
                        - - elements
                  as: we
                  index: wei
                  value:
                    node:
                      var: we
                    module:
                      var: wm
                    path:
                      op: concat
                      args:
                        - /modules/
                        - var: wmi
                        - /elements/
                        - var: wei
        - op: let
          name: elementIndex
          value:
            op: index
            args:
              - var: elements
            as: wi
            value:
              op: tuple
              args:
                - op: get
                  args:
                    - var: wi
                    - - module
                      - id
                - op: get
                  args:
                    - var: wi
                    - - node
                      - id
        - op: for
          each:
            op: keys
            args:
              - var: doc
          as: unknownKey
          body:
            - op: emit
              when:
                op: not
                args:
                  - op: in
                    args:
                      - var: unknownKey
                      - op: get
                        args:
                          - var: policy
                          - - knownKeys
                            - document
              diagnostic:
                code: UNKNOWN_CORE_FIELD
                path:
                  op: concat
                  args:
                    - ""
                    - /
                    - op: pointer
                      args:
                        - var: unknownKey
                message: Field retained without interpretation
                severity: warning
        - op: for
          each:
            op: entries
            args:
              - op: get
                args:
                  - var: doc
                  - - vocabularies
          as: v
          body:
            - op: for
              each:
                op: keys
                args:
                  - op: get
                    args:
                      - var: v
                      - - 1
              as: unknownKey
              body:
                - op: emit
                  when:
                    op: not
                    args:
                      - op: in
                        args:
                          - var: unknownKey
                          - - version
                  diagnostic:
                    code: UNKNOWN_CORE_FIELD
                    path:
                      op: concat
                      args:
                        - op: concat
                          args:
                            - /vocabularies/
                            - op: pointer
                              args:
                                - op: get
                                  args:
                                    - var: v
                                    - - 0
                        - /
                        - op: pointer
                          args:
                            - var: unknownKey
                    message: Field retained without interpretation
                    severity: warning
            - op: emit
              when:
                op: not
                args:
                  - op: registered
                    args:
                      - op: get
                        args:
                          - var: v
                          - - 0
                      - op: get
                        args:
                          - op: get
                            args:
                              - var: v
                              - - 1
                          - - version
              diagnostic:
                code: UNKNOWN_EXTENSION
                path:
                  op: concat
                  args:
                    - /vocabularies/
                    - op: pointer
                      args:
                        - op: get
                          args:
                            - var: v
                            - - 0
                message: Exact extension version unavailable; content retained
                severity: warning
        - op: for
          each:
            op: extension-errors
            args:
              - var: doc
              - op: get
                args:
                  - var: doc
                  - - extensions
              - document
              - ""
              - op: get
                args:
                  - var: policy
                  - - extensions
          as: extensionError
          body:
            - op: emit
              diagnostic:
                var: extensionError
        - op: let
          name: moduleIds
          value:
            op: set
            args: []
        - op: for
          each:
            op: get
            args:
              - var: doc
              - - modules
          as: m
          index: mi
          body:
            - op: let
              name: mp
              value:
                op: concat
                args:
                  - /modules/
                  - var: mi
            - op: for
              each:
                op: keys
                args:
                  - var: m
              as: unknownKey
              body:
                - op: emit
                  when:
                    op: not
                    args:
                      - op: in
                        args:
                          - var: unknownKey
                          - op: get
                            args:
                              - var: policy
                              - - knownKeys
                                - module
                  diagnostic:
                    code: UNKNOWN_CORE_FIELD
                    path:
                      op: concat
                      args:
                        - var: mp
                        - /
                        - op: pointer
                          args:
                            - var: unknownKey
                    message: Field retained without interpretation
                    severity: warning
            - op: remember
              set:
                var: moduleIds
              key:
                op: get
                args:
                  - var: m
                  - - id
              diagnostic:
                code: DUPLICATE_MODULE
                path:
                  op: concat
                  args:
                    - var: mp
                    - /id
                message: Module id is not unique
                severity: error
            - op: for
              each:
                op: extension-errors
                args:
                  - var: doc
                  - op: get
                    args:
                      - var: m
                      - - extensions
                  - module
                  - var: mp
                  - op: get
                    args:
                      - var: policy
                      - - extensions
              as: extensionError
              body:
                - op: emit
                  diagnostic:
                    var: extensionError
            - op: let
              name: elementIds
              value:
                op: set
                args: []
            - op: for
              each:
                op: get
                args:
                  - var: m
                  - - elements
              as: e
              index: ei
              body:
                - op: let
                  name: ep
                  value:
                    op: concat
                    args:
                      - var: mp
                      - /elements/
                      - var: ei
                - op: for
                  each:
                    op: keys
                    args:
                      - var: e
                  as: unknownKey
                  body:
                    - op: emit
                      when:
                        op: not
                        args:
                          - op: in
                            args:
                              - var: unknownKey
                              - op: get
                                args:
                                  - var: policy
                                  - - knownKeys
                                    - element
                      diagnostic:
                        code: UNKNOWN_CORE_FIELD
                        path:
                          op: concat
                          args:
                            - var: ep
                            - /
                            - op: pointer
                              args:
                                - var: unknownKey
                        message: Field retained without interpretation
                        severity: warning
                - op: emit
                  when:
                    op: and
                    args:
                      - op: has
                        args:
                          - var: e
                          - - kind
                      - op: not
                        args:
                          - op: in
                            args:
                              - op: get
                                args:
                                  - var: e
                                  - - kind
                              - op: get
                                args:
                                  - var: policy
                                  - - vocabulary
                                    - kind
                  diagnostic:
                    code: UNKNOWN_ELEMENT_KIND
                    path:
                      op: concat
                      args:
                        - var: ep
                        - /
                        - kind
                    message: Kind retained without interpretation
                    severity: warning
                - op: emit
                  when:
                    op: and
                    args:
                      - op: has
                        args:
                          - var: e
                          - - nullability
                      - op: not
                        args:
                          - op: in
                            args:
                              - op: get
                                args:
                                  - var: e
                                  - - nullability
                              - op: get
                                args:
                                  - var: policy
                                  - - vocabulary
                                    - nullability
                  diagnostic:
                    code: UNKNOWN_NULLABILITY
                    path:
                      op: concat
                      args:
                        - var: ep
                        - /
                        - nullability
                    message: Availability label retained without interpretation
                    severity: warning
                - op: emit
                  when:
                    op: and
                    args:
                      - op: has
                        args:
                          - var: e
                          - - cardinality
                      - op: not
                        args:
                          - op: in
                            args:
                              - op: get
                                args:
                                  - var: e
                                  - - cardinality
                              - op: get
                                args:
                                  - var: policy
                                  - - vocabulary
                                    - cardinality
                  diagnostic:
                    code: UNKNOWN_CARDINALITY
                    path:
                      op: concat
                      args:
                        - var: ep
                        - /
                        - cardinality
                    message: Container label retained without interpretation
                    severity: warning
                - op: if
                  test:
                    op: has
                    args:
                      - var: e
                      - - itemType
                  then:
                    - op: for
                      each:
                        op: keys
                        args:
                          - op: get
                            args:
                              - var: e
                              - - itemType
                      as: unknownKey
                      body:
                        - op: emit
                          when:
                            op: not
                            args:
                              - op: in
                                args:
                                  - var: unknownKey
                                  - op: get
                                    args:
                                      - var: policy
                                      - - knownKeys
                                        - itemType
                          diagnostic:
                            code: UNKNOWN_CORE_FIELD
                            path:
                              op: concat
                              args:
                                - op: concat
                                  args:
                                    - var: ep
                                    - /itemType
                                - /
                                - op: pointer
                                  args:
                                    - var: unknownKey
                            message: Field retained without interpretation
                            severity: warning
                  else: []
                - op: if
                  test:
                    op: has
                    args:
                      - var: e
                      - - facets
                  then:
                    - op: let
                      name: facets
                      value:
                        op: get
                        args:
                          - var: e
                          - - facets
                    - op: for
                      each:
                        op: keys
                        args:
                          - var: facets
                      as: unknownKey
                      body:
                        - op: emit
                          when:
                            op: not
                            args:
                              - op: in
                                args:
                                  - var: unknownKey
                                  - op: get
                                    args:
                                      - var: policy
                                      - - knownKeys
                                        - facets
                          diagnostic:
                            code: UNKNOWN_FACET
                            path:
                              op: concat
                              args:
                                - op: concat
                                  args:
                                    - var: ep
                                    - /facets
                                - /
                                - op: pointer
                                  args:
                                    - var: unknownKey
                            message: Facet member retained without interpretation
                            severity: warning
                    - op: emit
                      when:
                        op: and
                        args:
                          - op: has
                            args:
                              - var: facets
                              - - precision
                          - op: gt
                            args:
                              - op: get
                                args:
                                  - var: facets
                                  - - scale
                              - op: get
                                args:
                                  - var: facets
                                  - - precision
                      diagnostic:
                        code: FACET_SCALE
                        path:
                          op: concat
                          args:
                            - var: ep
                            - /facets/scale
                        message: Scale must not exceed precision
                        severity: error
                    - op: if
                      test:
                        op: has
                        args:
                          - var: facets
                          - - integerWidth
                      then:
                        - op: for
                          each:
                            op: keys
                            args:
                              - op: get
                                args:
                                  - var: facets
                                  - - integerWidth
                          as: unknownKey
                          body:
                            - op: emit
                              when:
                                op: not
                                args:
                                  - op: in
                                    args:
                                      - var: unknownKey
                                      - - bits
                                        - signed
                              diagnostic:
                                code: UNKNOWN_FACET
                                path:
                                  op: concat
                                  args:
                                    - op: concat
                                      args:
                                        - var: ep
                                        - /facets/integerWidth
                                    - /
                                    - op: pointer
                                      args:
                                        - var: unknownKey
                                message: Facet member retained without interpretation
                                severity: warning
                      else: []
                  else: []
                - op: emit
                  when:
                    op: and
                    args:
                      - op: has
                        args:
                          - var: e
                          - - scalarType
                      - op: not
                        args:
                          - op: in
                            args:
                              - op: get
                                args:
                                  - var: e
                                  - - scalarType
                              - op: get
                                args:
                                  - var: policy
                                  - - vocabulary
                                    - scalarType
                  diagnostic:
                    code: UNKNOWN_SCALAR_TYPE
                    path:
                      op: concat
                      args:
                        - var: ep
                        - /scalarType
                    message: Scalar family retained without interpretation
                    severity: warning
                - op: remember
                  set:
                    var: elementIds
                  key:
                    op: get
                    args:
                      - var: e
                      - - id
                  diagnostic:
                    code: DUPLICATE_ELEMENT
                    path:
                      op: concat
                      args:
                        - var: ep
                        - /id
                    message: Element id is not unique within module
                    severity: error
                - op: for
                  each:
                    op: extension-errors
                    args:
                      - var: doc
                      - op: get
                        args:
                          - var: e
                          - - extensions
                      - element
                      - var: ep
                      - op: get
                        args:
                          - var: policy
                          - - extensions
                  as: extensionError
                  body:
                    - op: emit
                      diagnostic:
                        var: extensionError
                - op: for
                  each:
                    op: get
                    args:
                      - var: e
                      - - references
                  as: reference
                  index: ri
                  body:
                    - op: for
                      each:
                        op: keys
                        args:
                          - var: reference
                      as: unknownKey
                      body:
                        - op: emit
                          when:
                            op: not
                            args:
                              - op: in
                                args:
                                  - var: unknownKey
                                  - op: get
                                    args:
                                      - var: policy
                                      - - knownKeys
                                        - reference
                          diagnostic:
                            code: UNKNOWN_CORE_FIELD
                            path:
                              op: concat
                              args:
                                - op: concat
                                  args:
                                    - var: ep
                                    - /references/
                                    - var: ri
                                - /
                                - op: pointer
                                  args:
                                    - var: unknownKey
                            message: Field retained without interpretation
                            severity: warning
        - op: for
          each:
            var: elements
          as: w
          body:
            - op: let
              name: e
              value:
                op: get
                args:
                  - var: w
                  - - node
            - op: let
              name: ep
              value:
                op: get
                args:
                  - var: w
                  - - path
            - op: for
              each:
                op: get
                args:
                  - var: e
                  - - references
              as: reference
              index: ri
              body:
                - op: emit
                  when:
                    op: not
                    args:
                      - op: lookup
                        args:
                          - var: elementIndex
                          - op: tuple
                            args:
                              - op: get
                                args:
                                  - var: reference
                                  - - module
                              - op: get
                                args:
                                  - var: reference
                                  - - element
                  diagnostic:
                    code: UNRESOLVED_REFERENCE
                    path:
                      op: concat
                      args:
                        - var: ep
                        - /references/
                        - var: ri
                    message: Target element does not exist in supplied document
                    severity: error
        - op: for
          each:
            var: elements
          as: w
          body:
            - op: let
              name: e
              value:
                op: get
                args:
                  - var: w
                  - - node
            - op: let
              name: ep
              value:
                op: get
                args:
                  - var: w
                  - - path
            - op: if
              test:
                op: has
                args:
                  - var: e
                  - - itemType
              then:
                - op: let
                  name: item
                  value:
                    op: lookup
                    args:
                      - var: elementIndex
                      - op: tuple
                        args:
                          - op: get
                            args:
                              - var: e
                              - - itemType
                                - module
                          - op: get
                            args:
                              - var: e
                              - - itemType
                                - element
                - op: if
                  test:
                    op: not
                    args:
                      - var: item
                  then:
                    - op: emit
                      diagnostic:
                        code: UNRESOLVED_ITEM_TYPE
                        path:
                          op: concat
                          args:
                            - var: ep
                            - /itemType
                        message: Item/value Field does not exist in supplied document
                        severity: error
                  else:
                    - op: emit
                      when:
                        op: ne
                        args:
                          - op: get
                            args:
                              - var: item
                              - - node
                                - kind
                          - field
                      diagnostic:
                        code: ITEM_TYPE_ROLE
                        path:
                          op: concat
                          args:
                            - var: ep
                            - /itemType
                        message: Item/value definition must be an explicit Field
                        severity: error
              else: []
        - op: let
          name: keyOwners
          value:
            op: set
            args: []
        - op: for
          as: keyEntry
          each:
            var: elements
          body:
            - op: let
              name: keyRecord
              value:
                op: get
                args:
                  - var: keyEntry
                  - - node
            - op: let
              name: keyRecordPath
              value:
                op: get
                args:
                  - var: keyEntry
                  - - path
            - op: if
              test:
                op: has
                args:
                  - var: keyRecord
                  - - members
              then:
                - op: let
                  name: keyOwnMembers
                  value:
                    op: set
                    args: []
                - op: for
                  as: memberRef
                  each:
                    op: get
                    args:
                      - var: keyRecord
                      - - members
                  body:
                    - op: let
                      name: memberPath
                      value:
                        op: concat
                        args:
                          - var: keyRecordPath
                          - /members/
                          - var: memberIndex
                    - op: let
                      name: memberIdentity
                      value:
                        op: tuple
                        args:
                          - op: get
                            args:
                              - var: memberRef
                              - - module
                          - op: get
                            args:
                              - var: memberRef
                              - - element
                    - op: let
                      name: memberField
                      value:
                        op: get
                        args:
                          - op: lookup
                            args:
                              - var: elementIndex
                              - op: tuple
                                args:
                                  - op: get
                                    args:
                                      - var: memberRef
                                      - - module
                                  - op: get
                                    args:
                                      - var: memberRef
                                      - - element
                          - - node
                    - op: for
                      as: qualifier
                      each:
                        op: keys
                        args:
                          - var: memberRef
                      body:
                        - op: emit
                          diagnostic:
                            code: UNKNOWN_KEY_QUALIFIER
                            path:
                              op: concat
                              args:
                                - var: memberPath
                                - /
                                - op: pointer
                                  args:
                                    - var: qualifier
                            message: Qualifier retained without interpretation
                            severity: warning
                          when:
                            op: not
                            args:
                              - op: in
                                args:
                                  - var: qualifier
                                  - op: get
                                    args:
                                      - var: policy
                                      - - keys
                                        - known
                                        - member
                    - op: remember
                      set:
                        var: keyOwnMembers
                      key:
                        var: memberIdentity
                      diagnostic:
                        code: KEY_DUPLICATE_MEMBER
                        path:
                          var: memberPath
                        message: Record membership repeats a Field identity
                        severity: error
                    - op: if
                      test:
                        op: not
                        args:
                          - op: in
                            args:
                              - var: memberIdentity
                              - var: elementIndex
                      then:
                        - op: emit
                          diagnostic:
                            code: KEY_MEMBER_MISSING
                            path:
                              var: memberPath
                            message: Member Field does not exist
                            severity: error
                      else:
                        - op: emit
                          diagnostic:
                            code: KEY_MEMBER_KIND
                            path:
                              var: memberPath
                            message: Record members must be explicit Fields
                            severity: error
                          when:
                            op: ne
                            args:
                              - op: get
                                args:
                                  - var: memberField
                                  - - kind
                              - field
                    - op: let
                      name: previousKeyOwner
                      value:
                        op: lookup
                        args:
                          - var: keyOwners
                          - var: memberIdentity
                    - op: emit
                      diagnostic:
                        code: KEY_MEMBER_OWNER
                        path:
                          var: memberPath
                        message:
                          op: concat
                          args:
                            - "Field already belongs to another Record: "
                            - var: previousKeyOwner
                        severity: error
                      when:
                        op: and
                        args:
                          - op: in
                            args:
                              - var: memberIdentity
                              - var: keyOwners
                          - op: ne
                            args:
                              - var: previousKeyOwner
                              - var: keyRecordPath
                    - op: remember
                      set:
                        var: keyOwners
                      key:
                        var: memberIdentity
                      value:
                        var: keyRecordPath
                  index: memberIndex
                - op: let
                  name: keyIds
                  value:
                    op: set
                    args: []
                - op: let
                  name: keyNames
                  value:
                    op: set
                    args: []
                - op: let
                  name: keySets
                  value:
                    op: set
                    args: []
                - op: let
                  name: keyPrimaries
                  value:
                    op: set
                    args: []
                - op: for
                  as: keyDefinition
                  each:
                    op: get
                    args:
                      - var: keyRecord
                      - - keys
                  body:
                    - op: let
                      name: keyPath
                      value:
                        op: concat
                        args:
                          - var: keyRecordPath
                          - /keys/
                          - var: keyIndex
                    - op: for
                      as: qualifier
                      each:
                        op: keys
                        args:
                          - var: keyDefinition
                      body:
                        - op: emit
                          diagnostic:
                            code: UNKNOWN_KEY_QUALIFIER
                            path:
                              op: concat
                              args:
                                - var: keyPath
                                - /
                                - op: pointer
                                  args:
                                    - var: qualifier
                            message: Qualifier retained without interpretation
                            severity: warning
                          when:
                            op: not
                            args:
                              - op: in
                                args:
                                  - var: qualifier
                                  - op: get
                                    args:
                                      - var: policy
                                      - - keys
                                        - known
                                        - key
                    - op: remember
                      set:
                        var: keyIds
                      key:
                        op: get
                        args:
                          - var: keyDefinition
                          - - id
                      diagnostic:
                        code: KEY_DUPLICATE_ID
                        path:
                          op: concat
                          args:
                            - var: keyPath
                            - /id
                        message: Key ID is not unique within the Record
                        severity: error
                    - op: remember
                      set:
                        var: keyNames
                      key:
                        op: get
                        args:
                          - var: keyDefinition
                          - - name
                      diagnostic:
                        code: KEY_DUPLICATE_NAME
                        path:
                          op: concat
                          args:
                            - var: keyPath
                            - /name
                        message: Key name is not unique within the Record
                        severity: error
                    - op: if
                      test:
                        op: eq
                        args:
                          - op: get
                            args:
                              - var: keyDefinition
                              - - primary
                          - true
                      then:
                        - op: remember
                          set:
                            var: keyPrimaries
                          key: true
                          diagnostic:
                            code: KEY_PRIMARY_COUNT
                            path:
                              op: concat
                              args:
                                - var: keyPath
                                - /primary
                            message: At most one key may be primary
                            severity: error
                    - op: let
                      name: keyFieldIdentities
                      value:
                        op: map
                        args:
                          - op: get
                            args:
                              - var: keyDefinition
                              - - fields
                        as: component
                        value:
                          op: canonical
                          args:
                            - op: tuple
                              args:
                                - op: get
                                  args:
