      - id: literal
        name: literal
        kind: field
        description: UMF language literal
        extensions:
          umf.metamodel:
            definition: literal
            shape:
              tag: exclusive-choice
              options:
                - tag: "null"
                - tag: object
                  fields:
                    boolean:
                      tag: boolean
                  mandatory:
                    - boolean
                  open: false
                - tag: object
                  fields:
                    integerToken:
                      tag: text
                      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$(?![\s\S])
                  mandatory:
                    - integerToken
                  open: false
                - tag: object
                  fields:
                    decimalToken:
                      tag: text
                      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$(?![\s\S])
                  mandatory:
                    - decimalToken
                  open: false
                - tag: object
                  fields:
                    string:
                      tag: text
                  mandatory:
                    - string
                  open: false
                - tag: object
                  fields:
                    binaryHex:
                      tag: text
                      pattern: ^([0-9a-fA-F]{2})*$(?![\s\S])
                  mandatory:
                    - binaryHex
                  open: false
                - tag: object
                  fields:
                    floatToken:
                      tag: text
                      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$(?![\s\S])
                  mandatory:
                    - floatToken
                  open: false
                - tag: object
                  fields:
                    date:
                      tag: text
                  mandatory:
                    - date
                  open: false
                - tag: object
                  fields:
                    time:
                      tag: text
                  mandatory:
                    - time
                  open: false
                - tag: object
                  fields:
                    timestamp:
                      tag: text
                  mandatory:
                    - timestamp
                  open: false
                - tag: object
                  fields:
                    array:
                      tag: sequence
                      item:
                        tag: link
                        target: literal
                  mandatory:
                    - array
                  open: false
                - tag: object
                  fields:
                    map:
                      tag: object
                      open:
                        tag: link
                        target: literal
                  mandatory:
                    - map
                  open: false
                - tag: object
                  fields:
                    bits128Hex:
                      tag: text
                      min: 32
                      max: 32
                      pattern: ^[0-9a-fA-F]{32}$(?![\s\S])
                  mandatory:
                    - bits128Hex
                  open: false
                - tag: object
                  fields:
                    uuid:
                      tag: text
                      min: 36
                      max: 36
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$(?![\s\S])
                  mandatory:
                    - uuid
                  open: false
