                    min: 1
                native:
                  tag: object
                  fields:
                    system:
                      tag: text
                      min: 1
                    version:
                      tag: text
                      min: 1
                    subset:
                      tag: text
                      min: 1
                  mandatory:
                    - system
                    - version
                    - subset
              mandatory:
                - validation
                - directions
                - evidence
              conditions:
                - tag: conditional
                  condition:
                    tag: object
                    fields:
                      directions:
                        tag: sequence
                        min: 1
                  yes:
                    tag: object
                    mandatory:
                      - native
                    fields:
