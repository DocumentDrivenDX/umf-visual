name: Library conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:source
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run test:package
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: bun run fetch:lini
      - run: bun run test:native
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:catalog
      - run: bun run test:catalog
      - run: bun run report:loss
      - run: bun run build:site
      - run: bun run test:site
      - uses: actions/upload-artifact@v4
        with:
          name: umf-visual-catalog
          path: dist-site/
