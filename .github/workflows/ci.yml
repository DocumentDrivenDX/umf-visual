name: Library conformance
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:source
      - run: bun run typecheck
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: bun run fetch:lini
      - run: bun test
      - run: bun run build
      - run: bun run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: umf-visual-package
          path: .cache/documentdrivendx-umf-visual-*.tgz
          include-hidden-files: true
          if-no-files-found: error
      - run: bun run test:native
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run test:native:wave2
      - run: bun run test:native:annotated
      - run: bun scripts/native-lini-entities-cohort.ts
      - run: bun scripts/native-lini-model-version-boundary.ts
      - run: bun scripts/native-mermaid-annotated.ts
      - run: bun scripts/native-mermaid-er-probe.ts
      - name: Qualify ordinary DOT cohort with the installed Graphviz runtime
        run: mkdir -p .cache && bun scripts/native-dot-cohort.ts | tee .cache/native-dot-cohort.json
      - run: bun run test:native:layout
      - run: bun run build:catalog
      # build:catalog joins durable host preview receipts; test:catalog validates
      # their source, profile, artifact, and image hashes without live host writes.
      - run: bun run test:catalog
      - run: bun run test:release:catalog
      - name: Require complete exact-source host cycles for the integration corpus
        run: bun scripts/catalog/verify-host-completion.ts
      - run: bun run report:loss
      - run: bun run report:loss:wave2
      - run: bun run report:loss:ledger --release
      - run: bun run build:site
      - run: bun run test:site
      - run: bun run test:site:profiles
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: umf-visual-profile-evidence
          path: |
            .cache/native-annotated.json
            .cache/native-lini-annotated.json
            .cache/native-lini-entities-cohort.json
            .cache/native-lini-model-version-boundary.json
            .cache/mermaid-annotated/receipt.json
            .cache/mermaid-annotated/*.svg
            .cache/mermaid-er-probe/receipt.json
            .cache/mermaid-er-probe/*.svg
            .cache/native-dot-cohort.json
            .cache/native-lini-visual-layout.json
            .cache/lini-visual-layout/*.png
            .cache/lini-visual-layout/*.json
            .cache/browser.json
            .cache/catalog-ui-browser.json
            .cache/catalog-ui-image-viewer.png
            .cache/catalog-ui-six-targets.png
            .cache/catalog-ui-six-targets-mobile.png
            dist-site/integrations.json
            .cache/host-completion.json
            .cache/loss-ledger.json
            .cache/catalog-profile-ui-browser.json
            .cache/catalog-profile-*.png
            fixtures/renderers/powerpoint/preview-receipt.json
            fixtures/renderers/powerpoint/assets/*.png
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: umf-visual-catalog
          path: dist-site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-site/
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: conformance
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
