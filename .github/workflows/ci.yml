name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:source
      - run: bun run typecheck
      - run: sudo apt-get update && sudo apt-get install -y graphviz && neato -V
      - run: bun run fetch:lini && mkdir -p .cache
      - run: bunx playwright install --with-deps chromium
      - run: bun test
      - run: bun run build
      - run: bun run test:package
      - run: bun run test:native
      - run: bun run test:browser
      - run: TREE_BUDGET_MB=10 python3 .github/size_guard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-output
          path: .cache/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y graphviz && neato -V
      - run: bun run fetch:lini && mkdir -p .cache
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:native:full
      - run: bun run test:native:wave2
      - run: bun run test:native:annotated
      - run: bun scripts/native-lini-entities-cohort.ts
      - run: bun scripts/native-lini-model-version-boundary.ts
      - run: bun scripts/native-mermaid-annotated.ts
      - run: bun scripts/native-mermaid-er-probe.ts
      - run: bun scripts/native-dot-cohort.ts | tee .cache/native-dot-cohort.json
      - run: bun run test:native:layout
      - run: bun run build:showcase
      - run: bun run build:reviews
      - run: bun run build:catalog
      - run: bun run build:site
      - run: bun run test:site
      - run: bun run test:site:showcase
      - run: bun run test:site:profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-output
          path: |
            .cache/**
            dist-site/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
