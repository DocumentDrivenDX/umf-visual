name: Pages
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: bun run fetch:lini && mkdir -p .cache
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:showcase
      - run: bun run build:reviews
      - run: bun run build:catalog
      - run: bun run build:site
      - run: bun run test:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site/
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
