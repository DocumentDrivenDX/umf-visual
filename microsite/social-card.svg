<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>umf.visuals — One model for diagrams.</title>
  <desc>A shared semantic model branches into three native diagram views.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b7c8be" opacity=".2"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#b9d49f" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#f4f2ec"/>
  <path d="M660 0H1200V630H660Z" fill="#123a31"/>
  <path d="M660 0H1200V630H660Z" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="55" width="48" height="48" rx="12" fill="#123a31"/>
    <text x="69" y="87" font-size="26" font-weight="700" fill="#f4f2ec" letter-spacing="-3">u·v</text>
    <text x="123" y="88" font-size="30" font-weight="700" letter-spacing="-1" fill="#123a31">umf.visuals</text>
    <text x="60" y="201" font-size="14" letter-spacing="3" fill="#586d60">A SHARED VISUAL LANGUAGE</text>
    <text x="55" y="291" font-size="78" font-weight="700" letter-spacing="-4" fill="#123a31">One model</text>
    <text x="55" y="378" font-size="78" font-weight="700" letter-spacing="-4" fill="#123a31">for diagrams.</text>
    <text x="60" y="443" font-size="23" fill="#586d60">Describe once. Render native views.</text>
    <path d="M60 523H590" stroke="#d1d6cb"/>
    <text x="60" y="565" font-size="17" fill="#586d60">documentdrivendx.github.io/umf-visual</text>
    <text x="709" y="91" font-size="13" letter-spacing="2.5" fill="#c3d5c7">SEMANTIC SOURCE → NATIVE VIEWS</text>
    <g stroke="#b9d49f" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M857 286V211H952"/><path d="M884 315H952"/><path d="M857 344V419H952"/>
    </g>
    <rect x="706" y="276" width="178" height="78" rx="12" fill="#d4e6b7"/>
    <text x="795" y="323" text-anchor="middle" font-size="27" font-weight="700" letter-spacing="-1" fill="#123a31">umf.visual</text>
    <g fill="#1d4a3e" stroke="#678c77" stroke-width="1.5">
      <rect x="966" y="167" width="174" height="86" rx="10"/>
      <rect x="966" y="272" width="174" height="86" rx="10"/>
      <rect x="966" y="377" width="174" height="86" rx="10"/>
    </g>
    <g fill="#d4e6b7" stroke="#d4e6b7" stroke-width="2">
      <path d="M1000 210H1106M1053 195V225"/><rect x="991" y="201" width="18" height="18" rx="3"/><rect x="1044" y="183" width="18" height="18" rx="3"/><rect x="1044" y="219" width="18" height="18" rx="3"/><rect x="1097" y="201" width="18" height="18" rx="3"/>
      <path d="M1004 315H1103"/><circle cx="1004" cy="315" r="10"/><circle cx="1053" cy="315" r="10"/><circle cx="1103" cy="315" r="10"/>
      <g fill="none"><rect x="992" y="397" width="46" height="45" rx="3"/><rect x="1068" y="397" width="46" height="45" rx="3"/><path d="M1038 419H1068M992 411H1038M1068 411H1114"/></g>
    </g>
    <text x="709" y="556" font-size="17" fill="#c3d5c7">Relationships. Layers. Records.</text>
